name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist/SomaniTV-Player-Setup-*-x64.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one installer" }
          $installer = $installers[0]
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii -LiteralPath "$($installer.FullName).sha256"

      - name: Upload installer artifact
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: SomaniTV-Player-Windows-x64
          path: |
            dist/SomaniTV-Player-Setup-*-x64.exe
            dist/SomaniTV-Player-Setup-*-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish the installer release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = Get-ChildItem dist/SomaniTV-Player-Setup-*-x64.exe | Select-Object -First 1
          $checksum = "$($installer.FullName).sha256"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Somani TV Player $tag" --notes "Windows player $tag, x64, machine-wide installer. Not code-signed. Verify the download against the .sha256 file."
            if ($LASTEXITCODE -ne 0) { throw "Could not create the release for $tag" }
          }
          gh release upload $tag $installer.FullName $checksum --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not attach the installer to $tag" }
          Write-Host "Published SomaniTV-Player-Setup to release $tag"
